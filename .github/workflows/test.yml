name: Tests

# CPU 多进程测试限制每个进程的数学库线程数，避免共享 runner 上的线程争用。
env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

defaults:
  run:
    shell: bash -el {0}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev"]

jobs:
  run_tests_ubuntu:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]

    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: Lightning-Template
          environment-file: environment.yaml
          auto-activate-base: false

      - name: List dependencies
        run: conda list

      - name: Run pytest
        run: python -m pytest -v

  run_tests_macos:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest"]

    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: Lightning-Template
          environment-file: environment.yaml
          auto-activate-base: false

      - name: List dependencies
        run: conda list

      - name: Run pytest
        run: python -m pytest -v

  run_tests_windows:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest"]

    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: Lightning-Template
          environment-file: environment.yaml
          auto-activate-base: false

      - name: List dependencies
        run: conda list

      - name: Run pytest
        run: python -m pytest -v

  # upload code coverage report
  code-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: Lightning-Template
          environment-file: environment.yaml
          auto-activate-base: false

      - name: Run tests and collect coverage
        run: python -m pytest --cov src

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
