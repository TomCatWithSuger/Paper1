name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev"]

jobs:
  run_tests_ubuntu:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]

    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.10

      - name: Sync dependencies
        run: uv sync --locked

      - name: List dependencies
        run: uv pip list

      - name: Run pytest
        run: uv run --frozen pytest -v

  run_tests_macos:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest"]

    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.10

      - name: Sync dependencies
        run: uv sync --locked

      - name: List dependencies
        run: uv pip list

      - name: Run pytest
        run: uv run --frozen pytest -v

  run_tests_windows:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest"]

    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.10

      - name: Sync dependencies
        run: uv sync --locked

      - name: List dependencies
        run: uv pip list

      - name: Run pytest
        run: uv run --frozen pytest -v

  # upload code coverage report
  code-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.10

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run tests and collect coverage
        run: uv run --frozen pytest --cov src

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
