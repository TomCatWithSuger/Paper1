# This workflow finds which files were changed, prints them,
# and runs `pre-commit` on those files.

# Inspired by the sktime library:
# https://github.com/alan-turing-institute/sktime/blob/main/.github/workflows/test.yml

name: Code Quality PR

on:
  pull_request:
    branches: [main, "release/*", "dev"]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: Lightning-Template
          environment-file: environment.yaml
          auto-activate-base: false

      - name: Run pre-commit on modified files
        env:
          BASE_REF: ${{ github.base_ref }}
          SKIP: research-quality
        run: |
          mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z "origin/$BASE_REF...HEAD")
          if (( ${#files[@]} )); then
            printf 'Checking %s\n' "${files[@]}"
            pre-commit run --show-diff-on-failure --files "${files[@]}"
          fi

      - name: Run full research quality gates
        if: ${{ !cancelled() }}
        run: python scripts/quality.py all
