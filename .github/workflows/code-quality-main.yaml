# Same as `code-quality-pr.yaml` but triggered on commit to main branch
# and runs on all files (instead of only the changed ones)

name: Code Quality Main

on:
  push:
    branches: [main]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: Lightning-Template
          environment-file: environment.yaml
          auto-activate-base: false

      - name: Run pre-commit
        env:
          SKIP: research-quality
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run research quality gates
        if: ${{ !cancelled() }}
        run: python scripts/quality.py all
