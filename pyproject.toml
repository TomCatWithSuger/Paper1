# uv 使用说明：
#   创建环境:  uv venv /home/tom/venvs/Lightning-Template  --python 3.10
#   激活环境:  source /home/tom/venvs/Lightning-Template/bin/activate
#   安装依赖:  uv sync --active
#   添加依赖:  uv add <package>   (自动更新 pyproject.toml 和 uv.lock)
#   升级依赖:  uv lock --upgrade   (仅更新 uv.lock)
#   移除依赖:  uv remove <package>
#   运行命令:  uv run python src/train.py

[project]
name = "lightning-hydra-template"
version = "0.0.1"
requires-python = "==3.10.*"
dependencies = [
  "gdown>=5,<6",
  "hydra-colorlog==1.2.0",
  "hydra-core==1.3.2",
  "hydra-optuna-sweeper==1.2.0",
  "lightning==2.6.5",
  "numpy==2.2.6",
  "requests>=2,<3",
  "rich==15.0.0",
  "rootutils==1.0.7",
  "setuptools==80.10.2",
  "soundfile==0.13.1",
  "s3prl==0.4.18",
  "torch==2.5.1",
  "torchaudio==2.5.1",
  "torchmetrics==0.11.4",
  "torchvision==0.20.1",
]

[dependency-groups]
dev = [
  "pre-commit==3.8.0",
  "pytest==7.4.4",
  "pytest-cov==5.0.0",
  "sh>=2,<3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]
