# @package _global_

defaults:
  - override /data: vctk
  - override /data/vctk_split: unseen_speaker_sentence
  - override /model: conditional_flow_matching
  - override /callbacks: default
  - override /trainer: default

tags: ["vctk", "conditional-flow-matching", "voice-conversion-baseline"]

seed: 12345

data:
  batch_size: 32

trainer:
  min_epochs: 1
  max_epochs: 500
  gradient_clip_val: 1.0

model:
  compile: false

callbacks:
  model_checkpoint:
    monitor: val/loss
    mode: min
  early_stopping:
    monitor: val/loss
    mode: min
