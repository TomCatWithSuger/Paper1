# @package _global_

defaults:
  - override /data: synthetic
  - override /model: flow_matching
  - override /callbacks: null
  - override /logger: null
  - override /trainer: cpu

tags: [offline, skill-smoke]
seed: 42

model:
  scheduler: null
  method:
    integration_steps: 2
    network:
      input_shape: ${data.input_shape}
      hidden_dims: [16, 16]
      time_embedding_dim: 8

trainer:
  min_epochs: 1
  max_epochs: 1
  limit_train_batches: 2
  limit_val_batches: 1
  limit_test_batches: 1
  limit_predict_batches: 1
  enable_checkpointing: false
  enable_model_summary: false
  enable_progress_bar: false

extras:
  enforce_tags: false
  print_config: false
