_target_: src.models.modules.generative.DDPMLitModule

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.0002
  weight_decay: 0.0

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: min
  factor: 0.5
  patience: 10

method:
  _target_: src.models.methods.generative.diffusion.ddpm.DDPM
  timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02
  network:
    _target_: src.models.networks.dense.field.DenseNoiseField
    input_shape: [1, 28, 28]
    hidden_dims: [512, 512, 256]
    time_embedding_dim: 64

compile: false
