_target_: src.models.modules.adversarial.GANLitModule

generator_optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.0002
  betas: [0.5, 0.999]
  weight_decay: 0.0

discriminator_optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.0002
  betas: [0.5, 0.999]
  weight_decay: 0.0

method:
  _target_: src.models.methods.generative.adversarial.gan.Adversarial
  network:
    _target_: src.models.networks.dense.adversarial.DenseAdversarialPair
    input_shape: [1, 28, 28]
    latent_dim: 100
    generator_hidden_dims: [256, 512, 1024]
    discriminator_hidden_dims: [512, 256]
    discriminator_dropout: 0.2

compile: false
