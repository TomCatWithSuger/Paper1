_target_: src.models.modules.voice_flow_module.VoiceFlowModule

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.0002

scheduler: null

validation_sampling_count: 4
test_sampling_count: 8
evaluation_seed: 12345

method:
  _target_: src.models.methods.generative.flow.mean_flow.conditional_mean_flow.ConditionalMeanFlow
  equal_time_probability: 0.75
  condition_encoder:
    _target_: src.models.components.conditioning.meanvc.CachedConditionEncoder
    content_dim: 256
    speaker_dim: 256
    output_dim: 128
  network:
    _target_: src.models.networks.unet.conditional.UNet
    n_mels: 80
    condition_dim: 128
    hidden_channels: 512
    time_embedding_dim: 128
    kernel_size: 3
    time_fields: [time, interval]

compile: false
