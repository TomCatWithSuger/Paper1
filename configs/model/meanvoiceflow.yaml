_target_: src.models.meanvoiceflow_module.MeanVoiceFlowLitModule

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.0002
  betas: [0.5, 0.9]

scheduler: null

equal_time_probability: 0.75
conditional_input_probability: 0.5
zero_reconstruction_weight: 1.0
zero_reconstruction_margin: 0.3
adaptive_loss_epsilon: 1.0e-3
inference_source_diffusion_time: 0.95
warmup_steps: 10000

condition_encoder:
  _target_: src.models.components.meanvc_conditioning.CachedConditionEncoder
  content_dim: 256
  speaker_dim: 256
  output_dim: 128

net:
  _target_: src.models.components.meanvoiceflow_unet.MeanVoiceFlowUNet
  n_mels: 80
  condition_dim: 128
  hidden_channels: 512
  time_embedding_dim: 128
  kernel_size: 3

compile: false
