_target_: src.models.modules.voice_flow_module.VoiceFlowModule

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.0002
  betas: [0.5, 0.9]

scheduler: null

warmup_steps: 10000

method:
  _target_: src.models.methods.generative.flow.mean_flow.meanvoiceflow.MeanVoiceFlow
  equal_time_probability: 0.75
  conditional_input_probability: 0.5
  zero_reconstruction_weight: 1.0
  zero_reconstruction_margin: 0.3
  adaptive_loss_epsilon: 1.0e-3
  inference_source_diffusion_time: 0.95
  condition_encoder:
    _target_: src.models.components.conditioning.meanvc.CachedConditionEncoder
    content_dim: 256
    speaker_dim: 256
    output_dim: 128
  network:
    _target_: src.models.networks.unet.conditional.UNet
    n_mels: 80
    condition_dim: 128
    hidden_channels: 512
    time_embedding_dim: 128
    kernel_size: 3
    time_fields: [time, interval, source_time]

compile: false
