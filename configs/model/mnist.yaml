_target_: src.models.modules.classification.ClassificationLitModule

num_classes: 10

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.001
  weight_decay: 0.0

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: min
  factor: 0.1
  patience: 10

method:
  _target_: src.models.methods.discriminative.classification.Classification
  network:
    _target_: src.models.networks.dense.classifier.SimpleDenseNet
    input_size: 784
    lin1_size: 64
    lin2_size: 128
    lin3_size: 64
    output_size: 10

# compile model for faster training with pytorch 2.0
compile: false
